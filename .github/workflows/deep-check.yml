# Deep regression check. Full Playwright matrix (Chromium + WebKit across
# desktop + mobile-android + mobile-ios + tablet) + Lighthouse CI
# resource-size regression gate + the live staging MCP sweep. Three jobs
# run in parallel.
#
# Triggers:
#   schedule           — 06:00 UTC daily (~23:00 / 01:00 PT overnight).
#                        GATED: the `preflight` job skips the two
#                        expensive jobs when nothing actionable has
#                        happened since the last deep-check run. See
#                        "Preflight gate" below.
#   workflow_dispatch  — manual run, bypasses the preflight gate. Useful
#                        before a dev → main promotion or when chasing a
#                        flake.
#
# Preflight gate:
#   The scheduled trigger fires every day at 06:00 UTC regardless of
#   activity. Without a gate, we pay CI minutes even when dev is quiet
#   or when the same red state is already on file. The `preflight` job
#   decides whether the work jobs (`e2e`, `lhci`, `staging-mcp`)
#   actually run:
#
#     should_run = true IFF
#       • no prior deep-check run exists (first-ever run), OR
#       • there is a successful `ci.yml` run strictly after the last
#         deep-check run (meaning: new validated code has landed since
#         we last did a deep sweep).
#
#   Alternative compare point ("last passing deep-check") is one word
#   swap away — see the comment inline at the `last_dc_at` query.
#   Current choice: compare against the last deep-check run of ANY
#   status, because retrying the same failed state without new code
#   is waste; a real fix lands via a PR (which runs ci.yml), which
#   satisfies the gate on the next scheduled run.
#
# Not a PR gate — PR merge is governed by ci.yml. Failures here show up
# in the Actions tab and (for dispatch-with-ref runs) as a commit status.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — passed to `wrangler dev`
#     (used by both Playwright's webServer and lighthouse-ci). wrangler 4.x
#     authenticates to the Cloudflare managed registry to read the
#     container image manifest even under `--local`, so without these the
#     dev server fails with "Not logged in". The same secrets that
#     `deploy.yml` already passes — no new provisioning. Introduced after
#     the container image moved off Docker Hub to the CF managed
#     registry in PR #84 (U3-followup); the LHCI step uses the default
#     GITHUB_TOKEN to post a commit status (requires statuses:write,
#     granted below).
#   ANC_STAGING_ACCESS_CLIENT_ID / ANC_STAGING_ACCESS_CLIENT_SECRET:
#     Cloudflare Access service-token pair for the Access-gated staging
#     Worker, read by the `staging-mcp` job. Repository-scoped (the
#     `staging` environment declares no secrets of its own), so the
#     environment declaration on that job is a deployment-surface label
#     and a review seam, not what makes the secrets resolve. The same
#     pair `deploy.yml` already uses, so no new provisioning.

name: deep-check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to check (branch, tag, or SHA). Defaults to the default branch HEAD."
        required: false
        type: string

concurrency:
  group: deep-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  # Needed by preflight's `gh api actions/workflows/...` calls to list prior runs.
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: preflight · skip if nothing new
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Manual dispatch always runs. Treat it as "I know what I'm asking for."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ workflow_dispatch — running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Last deep-check run (any status, any conclusion), excluding the
          # current in-progress run. To gate on "last PASSING deep-check"
          # instead, add `status=success&` to the query string below.
          last_dc_at=$(gh api \
            "repos/$GH_REPO/actions/workflows/deep-check.yml/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != $THIS_RUN_ID)] | .[0].created_at // \"\"")

          if [ -z "$last_dc_at" ]; then
            echo "→ no prior deep-check run — running (first run)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Last SUCCESSFUL ci.yml run.
          last_ci_at=$(gh api \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // ""')

          if [ -z "$last_ci_at" ]; then
            echo "→ no successful CI run on record — skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "last deep-check at: $last_dc_at"
          echo "last passing CI at: $last_ci_at"

          if [ "$(date -d "$last_ci_at" +%s)" -gt "$(date -d "$last_dc_at" +%s)" ]; then
            echo "→ CI passed after last deep-check — running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ nothing new since last deep-check — skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e · playwright (chromium + webkit)
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      upstream_crash: ${{ steps.wrangler-crash.outputs.upstream }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Playwright browser binaries are ~500 MB for chromium + webkit.
      # Cache keyed on bun.lock so a @playwright/test version bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium webkit

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium webkit

      - name: Build
        run: bun run build

      - name: End-to-end tests (all projects)
        # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID let `wrangler dev`
        # (spun up by playwright.config.ts's webServer) read the
        # container image manifest from the CF managed registry. Without
        # them, wrangler 4.x errors with "Not logged in" before Playwright
        # can connect.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bun run test:e2e

      # Keeps the wrangler log this job's failures are diagnosed from, and
      # reports whether the dev server died from the upstream crash. Both
      # this job and lhci run `wrangler dev`, so the signature lives in one
      # place rather than drifting between two copies.
      - name: Probe for the upstream wrangler crash
        if: failure()
        id: wrangler-crash
        uses: ./.github/actions/wrangler-crash-probe

      # `.context/test-results/`, not `test-results/`: that is where
      # playwright.config.ts points `outputDir`, and the traces, screenshots,
      # and error-context files a failure writes land there. `if-no-files-found:
      # error` turns an empty capture into a failing step, because the previous
      # spelling uploaded nothing while reporting success and cost four rounds
      # of triage that had no evidence to work from.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            .context/test-results/
            wrangler-logs/
          if-no-files-found: error
          retention-days: 14

  # Buys exactly one more draw at a runner, and only for a crash that is
  # provably wrangler's. Re-running the job allocates a fresh VM, which is
  # the part that matters: the fault tracks the machine rather than the
  # moment, so a runner tends to be either healthy or fatal for the life of
  # the job. Restarting the dev server in place plateaus at roughly one run
  # in twenty; landing on a different runner drops it under one in a hundred.
  #
  # `run_attempt` caps it at a single retry, so a persistently affected
  # runner fails the run instead of looping. A rerun replays the existing
  # run rather than creating a new one, so GITHUB_TOKEN drives it without
  # tripping the recursion block that stops tokens from starting workflows.
  wrangler-crash-retry:
    name: retry once on the upstream wrangler crash
    needs: [e2e, lhci]
    # `failure()` alone would fire for any failure in either job; the output
    # gates narrow it to the one crash a retry can do anything about. A job
    # the preflight gate skipped reports an empty output and never matches.
    if: >-
      failure() && github.run_attempt == 1
      && (needs.e2e.outputs.upstream_crash == 'true' || needs.lhci.outputs.upstream_crash == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Re-run the affected jobs on fresh runners
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          E2E_CRASHED: ${{ needs.e2e.outputs.upstream_crash }}
          LHCI_CRASHED: ${{ needs.lhci.outputs.upstream_crash }}
        run: |
          set -euo pipefail

          targets=()
          [ "$E2E_CRASHED" = "true" ] && targets+=("e2e · playwright")
          [ "$LHCI_CRASHED" = "true" ] && targets+=("lhci · lighthouse")

          # Names are matched against the current attempt's job list rather
          # than hardcoded ids, which change every run. Read once: a rerun
          # mutates the list underneath a second call.
          gh api --paginate \
            "repos/$GH_REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --jq '.jobs[] | "\(.id)\t\(.name)"' > jobs.tsv

          for prefix in "${targets[@]}"; do
            job_id=$(awk -F'\t' -v p="$prefix" 'index($2, p) == 1 { print $1; exit }' jobs.tsv)
            if [ -z "$job_id" ]; then
              echo "could not resolve a job id for '$prefix' — leaving that failure as reported" >&2
              exit 1
            fi
            echo "workers-sdk#15317 signature matched for '$prefix'; re-running job $job_id"
            gh run rerun --job "$job_id"
          done

  staging-mcp:
    name: staging-mcp · live MCP, discoverability, and web-audit result page
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      # Defaults to `dev`, not the default branch: staging deploys from
      # `dev`, so a scheduled run on any other ref would assert specs
      # against a deployment they do not describe. The sibling jobs boot
      # their own local Worker and keep the default checkout.
      #
      # An explicit dispatch ref overrides it, which is how a change to
      # these specs or to the Playwright projects gets verified before it
      # merges: without the override the job would run the dispatched
      # workflow file against `dev`'s config and fail on projects that do
      # not exist there yet. The override is for test-side changes. A
      # branch that changes Worker behaviour still needs deploying to
      # staging first, because the specs assert against the deployment,
      # not against the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'dev' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The key names the browser set, not just the lockfile, because the
      # install step below is skipped on a hit. A key that outlives a change
      # to that set restores a cache missing the new browser and the run
      # fails at launch, which is what happened when webkit was added while
      # the key still said `-chromium`. Renaming the segment busts it once.
      # It also keeps this job's entry from colliding with the e2e job's.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium webkit

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium webkit

      # No `bun run build` step: ANC_STAGING_BASE_URL makes
      # playwright.config.ts skip the local wrangler-dev webServer, and
      # neither spec in this project reads from dist/.
      #
      # ANC_STAGING_BASE_URL is set here rather than at workflow level on
      # purpose: a workflow-global value would repoint every Playwright
      # project at staging and disable the local webServer for the e2e
      # job. It stays scoped to the one step that needs it.
      - name: MCP + discoverability e2e (live staging)
        env:
          ANC_STAGING_BASE_URL: https://agentnative-site-staging.brettdavies.workers.dev
          ANC_STAGING_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          ANC_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: bun x playwright test --project=staging-mcp

      # The result-page suite reaches staging the same way: the spec pins its
      # own baseURL and Access headers, so it needs this step's env and not a
      # project of its own. It runs here rather than in the `e2e` job because
      # that job deliberately leaves ANC_STAGING_BASE_URL unset, which makes
      # the spec skip its whole body. Both engines run: see web-audit-webkit
      # in playwright.config.ts for what WebKit adds over Chromium.
      - name: Web-audit result page e2e (live staging, chromium + webkit)
        env:
          ANC_STAGING_BASE_URL: https://agentnative-site-staging.brettdavies.workers.dev
          ANC_STAGING_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          ANC_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: bun x playwright test --project=web-audit --project=web-audit-webkit

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-staging-mcp
          path: |
            playwright-report/
            .context/test-results/
          if-no-files-found: error
          retention-days: 14

  lhci:
    name: lhci · lighthouse
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      upstream_crash: ${{ steps.wrangler-crash.outputs.upstream }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lighthouse CI
        run: bun x @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `wrangler dev` (started by lighthouserc as the local server)
          # needs CF auth to read the container image manifest from the
          # CF managed registry, same as the e2e job above.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # lighthouserc starts its own `wrangler dev`, so this job is open to
      # the same crash the e2e job is. Without the probe a dead dev server
      # here reports as a Lighthouse assertion failure with no log to read.
      - name: Probe for the upstream wrangler crash
        if: failure()
        id: wrangler-crash
        uses: ./.github/actions/wrangler-crash-probe

      - name: Upload wrangler logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lhci-wrangler-logs
          path: wrangler-logs/
          if-no-files-found: warn
          retention-days: 14
