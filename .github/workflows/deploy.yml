# Deploy workflow — two targets, one workflow.
#
# Staging (dev branch):
#   Pushes to `dev` deploy to the `agentnative-site-staging` Worker
#   at `agentnative-site-staging.<subdomain>.workers.dev`. The Worker's
#   staging-host guard (src/worker/headers.ts `isStagingHost`) adds
#   `X-Robots-Tag: noindex` on every *.workers.dev response.
#
# Production (main branch):
#   Pushes to `main` deploy to the `agentnative-site` Worker with
#   the `anc.dev` custom domain attached. Full indexing, no .workers.dev.
#
# Ref: https://developers.cloudflare.com/workers/wrangler/environments/
#
# Secrets:
#   - `CF_API_TOKEN` — Cloudflare API token with `Workers Scripts:Edit`
#     + `Account:Read` scope.
#   - `CF_ACCOUNT_ID` — Cloudflare account ID. Not a formal secret but
#     kept out of the public repo; wrangler reads it from the
#     `CLOUDFLARE_ACCOUNT_ID` env var.

name: deploy

on:
  push:
    branches:
      - main
      - dev
    # Skip deploy when the commit only touches docs that aren't ingested
    # at build time. `content/**` (rendered into the site) is deliberately
    # NOT in this list — content changes must still deploy. `docs/**`
    # covers planning/design/solution docs, and `*.md` matches only
    # root-level .md files (README/AGENTS/RELEASES/CHANGELOG) because the
    # `*` glob doesn't match path separators — `content/*.md` still
    # triggers deploy. `workflow_dispatch` below is unaffected.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to deploy (branch, tag, or SHA).'
        required: false
        type: string
      environment:
        description: 'Target: staging (workers.dev) or production (anc.dev).'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

# Opt into Node.js 24 runtime for JS actions before June 2nd, 2026 when
# GitHub forces the switch anyway. Kills the Node 20 deprecation warnings
# and catches any incompatibilities now instead of the day of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  staging:
    name: build + deploy staging
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    environment:
      name: staging
    # The host this deployment answers on. `src/build/util.mjs`
    # resolveBaseUrl() reads PUBLIC_BASE_URL, so every navigational link the
    # build bakes (llms.txt, markdown twins, skill pointers, the endpoint
    # directories under /.well-known) points back at staging instead of
    # production. Canonical/SEO metadata deliberately ignores it and stays
    # on the canonical host — see canonicalBaseUrl() in the same file.
    # Production leaves it unset and falls through to the canonical default.
    env:
      PUBLIC_BASE_URL: https://agentnative-site-staging.brettdavies.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to staging
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env staging

      - name: Smoke /api/score (registry-fast-path)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: scripts/smoke-api-score.sh "$PUBLIC_BASE_URL"

      # Settle the MCP route before smoking it. Edge propagation lags
      # `wrangler deploy`, and a stale isolate 404s the new route; curl
      # does not retry 4xx without --retry-all-errors. `|| true` keeps a
      # never-settling route out of the deploy's pass/fail decision — the
      # smoke below reports that state without blocking.
      - name: Await MCP route propagation
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: |
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PUBLIC_BASE_URL/.well-known/mcp/server-card.json" || true

      # Core checks only: the script's symmetry and live-audit gates each
      # spend a unit of the per-IP audit budget and minutes of wall clock,
      # which belongs to the release preflight/postflight, not to every
      # push to `dev`. Observational for now — `continue-on-error` keeps a
      # red MCP surface from blocking the deploy, and the companion step
      # publishes the log.
      #
      # `shell: bash` is load-bearing: the default `bash -e {0}` has no
      # `pipefail`, so `mcp-smoke.sh | tee` would exit with tee's status
      # and a failing smoke would report `outcome: success`.
      - name: Smoke live MCP surface
        id: mcp_smoke
        continue-on-error: true
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: |
          scripts/release/mcp-smoke.sh --core-only "$PUBLIC_BASE_URL" 2>&1 \
            | tee "$RUNNER_TEMP/mcp-smoke.log"

      # `if: failure()` never fires for a `continue-on-error` step — its
      # job-level conclusion is success — so gate on the step outcome.
      - name: Publish MCP smoke log
        if: steps.mcp_smoke.outcome == 'failure'
        run: |
          {
            echo "### MCP staging smoke failed (non-blocking)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/mcp-smoke.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Repopulate R2 under the current SPEC_VERSION: a deploy (or a spec
      # bump that rotates every cache key) starts a full board rescore.
      # `curl -sSf` fails the job on any non-2xx, so a missing or wrong
      # secret is a loud deploy failure, not a silent 401. The retry set
      # covers edge-propagation lag right after `wrangler deploy`: a stale
      # isolate 404s the new route, and curl does not retry 4xx without
      # --retry-all-errors.
      - name: Trigger web rescore
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
          WEB_RESCORE_SECRET: ${{ secrets.ANC_WEB_RESCORE_SECRET }}
        run: |
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "x-web-rescore-secret: $WEB_RESCORE_SECRET" \
            "$PUBLIC_BASE_URL/api/web-rescore"

      # The bun test suite proves the CODE resolves each surface's origin
      # from its own request. It would still pass if someone deleted
      # PUBLIC_BASE_URL from this job, because that env var is not code.
      # This step checks the DEPLOYMENT: ask staging for a link and see
      # which host comes back.
      #
      # Two surfaces, both minted at request time from the origin the
      # request arrived on: the MCP handshake instructions and a
      # get_scorecard result (the exact field that shipped a production
      # link from staging). Each is asserted twice — the production host
      # must be absent AND the staging host present, so a 503 or an empty
      # body cannot pass by saying nothing at all.
      - name: Smoke deployment-relative links
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ANC_STAGING_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          host="${PUBLIC_BASE_URL#https://}"

          mcp_call() {
            curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -m 20 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -d "$1" "$PUBLIC_BASE_URL/mcp"
          }

          assert_self_hosted() {
            local label=$1 body=$2
            if grep -qF 'https://anc.dev' <<<"$body"; then
              echo "::error::$label on staging handed out a production URL"
              grep -oF -m5 'https://anc.dev' <<<"$body" || true
              exit 1
            fi
            if ! grep -qF "$host" <<<"$body"; then
              echo "::error::$label emitted no staging URL at all; the check proves nothing"
              exit 1
            fi
            echo "$label: links resolve to $host"
          }

          init=$(mcp_call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"anc-origin-smoke","version":"0"}}}')
          assert_self_hosted "MCP instructions" "$init"

          card=$(mcp_call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_scorecard","arguments":{"slug":"ripgrep"}}}')
          assert_self_hosted "get_scorecard result" "$card"

  production:
    name: build + deploy production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://anc.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # --env="" tells wrangler explicitly to use the top-level config
          # (the production environment in this repo's multi-env shape).
          # Without it, wrangler 4.x warns about ambiguity even though
          # bare `deploy` does the right thing.
          command: deploy --env=""

      # Same post-deploy rescore as staging; anc.dev is public, so no
      # Access headers. Fails the job loudly on any non-2xx, with the same
      # propagation-lag retry set.
      - name: Trigger web rescore
        env:
          WEB_RESCORE_SECRET: ${{ secrets.ANC_WEB_RESCORE_SECRET }}
        run: |
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -X POST \
            -H "x-web-rescore-secret: $WEB_RESCORE_SECRET" \
            https://anc.dev/api/web-rescore

  production-smoke:
    name: smoke production surface
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shares the deploy's group so a second merge to main cannot swap the
    # deployment out from under a running smoke: the next production deploy
    # queues until this job releases the group.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Burn-in: a red smoke marks this job failed while the run (and the
    # deploy) stays green. The flip to blocking is deleting this one line;
    # its criterion, the red-run policy, the canned diagnoses, and the
    # job-level verification habit live in
    # docs/runbooks/live-surface-sweep.md. Run-level green says nothing
    # about this job — check its own conclusion via `gh run view --json jobs`.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Settle the surface before hard assertions. Edge propagation lags
      # `wrangler deploy`, and a stale isolate 404s the new route; curl
      # does not retry 4xx without --retry-all-errors. `|| true` keeps a
      # never-settling route out of this step's pass/fail decision — the
      # smokes below report that state.
      - name: Await route propagation
        run: |
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null \
            https://anc.dev/.well-known/mcp/server-card.json || true

      # Core checks only (1–7): the symmetry and live-audit gates each
      # spend a unit of the per-IP audit budget and minutes of wall clock,
      # which belongs to the release preflight/postflight, not to every
      # production deploy.
      - name: Smoke live MCP surface
        run: scripts/release/mcp-smoke.sh --core-only https://anc.dev

      # Registry fast-path only. anc.dev is public (no Access headers),
      # and a curated slug answers before the Turnstile gate, so the
      # script's default token works unchanged against production.
      - name: Smoke /api/score (registry-fast-path)
        run: scripts/smoke-api-score.sh https://anc.dev
