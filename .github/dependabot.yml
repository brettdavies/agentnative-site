# Dependabot for the Bun / TypeScript toolchain (bun) and the workflow actions
# (github-actions). The `bun` ecosystem regenerates bun.lock inside each update
# PR; the `npm` ecosystem refuses a project that carries bun.lock. Workflow
# actions are SHA-pinned to immutable commits, so Dependabot is what surfaces a
# newer SHA; without the github-actions block the pins never move.
#
# The bun updater writes bun.lock with the Bun its image bundles, which can
# differ from the repo's pinned Bun, and it cannot read the lockfileVersion 2
# that a from-scratch Bun 1.4 install writes
# (https://github.com/dependabot/dependabot-core/issues/16026). Keep bun.lock
# at lockfileVersion 1. When CI's frozen install rejects a Dependabot lockfile,
# run `bun install` with the pinned Bun on the PR branch and push.
#
# `target-branch: dev` is required on every block: without it
# Dependabot opens PRs against the default branch (main), which breaks the
# dev -> main flow. Dependabot reads this config from the default branch, so it
# must live on main to take effect.
#
# Both version-update blocks batch every minor and patch into one PR per week
# and ignore majors on every dependency (a major is a reviewed step, never an
# automatic one). The github-actions group uses `patterns` rather than
# `update-types` because a SHA pin's SemVer level comes from a trailing comment
# and an unclassifiable action would otherwise fall out of the group and open
# alone.
#
# The Playwright family (@playwright/*, playwright, playwright-core) is frozen
# with no `update-types`: exact-pinned to the version dotfiles provisions into
# $PLAYWRIGHT_BROWSERS_PATH, so bumping is a dotfiles job, not a per-repo one.
#
# bun-types is frozen with no `update-types`: it moves only with the Bun
# runtime pinned in .bun-version, and a test holds the two together.
#
# Dependabot opens no security updates for Bun, and its alerts cover only the
# direct dependencies in package.json: the dependency graph does not read
# bun.lock. `bun audit` checks the whole lockfile. Fix an advisory by bumping
# the dependency by hand and running `bun install`.
# https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories#bun
version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@playwright/*"
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
      - dependency-name: "bun-types"
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
